name: Publish
on:
  push:
    tags: ['v*.*.*']
  # Manual run: checks the npm trusted publisher without publishing anything.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check tag matches package
        run: node -e 'if (process.env.GITHUB_REF_NAME !== `v${require("./package.json").version}`) process.exit(1)'
      - run: npm publish --provenance --access public
        env:
          RELEASE_MODE: 'true'

  trusted-publisher-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Exchange this workflow's OIDC token for an npm publish token (discarded)
        run: |
          set -euo pipefail
          id_token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/n8n-nodes-serpkite)
          echo "npm OIDC token exchange: HTTP $code"
          if [ "${code:0:1}" != 2 ]; then
            echo "::error::No npm trusted publisher accepts SerpKite/n8n-nodes-serpkite publish.yml"
            exit 1
          fi
